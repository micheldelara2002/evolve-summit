services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_LEGACY_SDK_IMPORTS=${BASE44_LEGACY_SDK_IMPORTS:-true}
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  web_node_modules:
